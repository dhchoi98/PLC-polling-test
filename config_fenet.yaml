# XBL-EMTA FEnet 이더넷 테스트 전용 설정
# 사용법: python scripts/single_read.py -c config_fenet.yaml

plc:
  name: "LS-XGB-FENET-TEST"
  protocol: "xgt-fenet"
  connection: "ethernet"

  ethernet:
    host: "192.168.0.50"   # ← XG5000에서 XBL-EMTA IP 확인 후 변경
    port: 2004             # ← FEnet 기본 포트 (변경하지 않았으면 2004)
    timeout: 2.0

  # XBL-EMTA 슬롯 번호 (XG5000 → I/O 파라미터에서 확인)
  fenet_slot: 3

  # 읽을 디바이스 목록 (시리얼 테스트와 동일)
  devices:
    - name: "counter_test"
      device: "D"
      address: 0
      count: 10
      type: "word"
      description: "D0~D9 워드 읽기 테스트"

    - name: "bit_status"
      device: "M"
      address: 0
      count: 16
      type: "bit"
      description: "M0~M15 비트 상태 테스트"

# 폴링 테스트 설정
polling:
  interval_sec: 1.0
  duration_sec: 60
  log_file: "polling_results_fenet.csv"
